# Both demo names share the attested certificate and chat backend. Local
# caller policies select different references for positive and negative cases.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name match.demo.genxt.network;

    ssl_certificate /etc/confido/certificate.pem;
    ssl_certificate_key /etc/confido/private_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /tee-report {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8001/tee-report;
        proxy_read_timeout 35s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location = /aTLS { return 404; }

    location / {
        auth_basic "Flint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        include /etc/nginx/conf.d/flint-api-key.conf;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mismatch.demo.genxt.network;

    ssl_certificate /etc/confido/certificate.pem;
    ssl_certificate_key /etc/confido/private_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /tee-report {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8001/tee-report;
        proxy_read_timeout 35s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location = /aTLS { return 404; }

    location / {
        auth_basic "Flint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        include /etc/nginx/conf.d/flint-api-key.conf;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name match.demo.genxt.network mismatch.demo.genxt.network;
    return 308 https://$host$request_uri;
}
